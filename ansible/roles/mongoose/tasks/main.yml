---

- name: "create user for undead mongoose"
  ansible.builtin.user:
    name: "mongoose"
    home: "{{ home }}"
    shell: "/usr/sbin/nologin"
    state: "present"
    system: true
    create_home: false

- name: "Create home directory"
  ansible.builtin.file:
    path: "{{ home }}"
    owner: "mongoose"
    group: "mongoose"
    mode: "2775"
    state: "directory"

- name: "copy nginx configuration"
  ansible.builtin.template:
    src: "mongoose.conf.j2"
    dest: "/etc/nginx/sites-available/mongoose.{{ canonical_hostname }}.conf"
  notify: "reload nginx"

- name: "enable nginx configuration"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/mongoose.{{ canonical_hostname }}.conf"
    path: "/etc/nginx/sites-enabled/mongoose.{{ canonical_hostname }}.conf"
    state: "link"
  notify: "reload nginx"

- name: "set up postgres for mongoose"
  become_user: "postgres"
  become: true
  block:

  - name: "ensure mongoose user exists"
    community.postgresql.postgresql_user:
      name: "mongoose"

  - name: "ensure mongoose database exists"
    community.postgresql.postgresql_db:
      name: "mongoose"
      owner: "mongoose"

  - name: "ensure mongoose role exists"
    community.postgresql.postgresql_user:
      db: "mongoose"
      name: "mongoose"
      role_attr_flags: "CREATEDB,LOGIN"

  - name: "ensure mongoose database privileges are set properly"
    ignore_errors: "{{ ansible_check_mode }}"
    community.postgresql.postgresql_privs:
      db: "mongoose"
      role: "mongoose"
      type: "database"
      privs: "ALL"

- name: "create images directory in backup directory"
  ansible.builtin.file:
    path: "{{ backup_data_dir }}/mongoose"
    owner: "mongoose"
    group: "mongoose"
    mode: "2775"
    state: "directory"

- name: "set up mongoose repo"
  become_user: "mongoose"
  become: true
  block:
  - name: "clone mongoose repository"
    ansible.builtin.git:
      repo: "https://github.com/svsticky/undead-mongoose"
      dest: "{{ home }}/repo"
      depth: 1
      force: true
      version: "master"
    diff: false

  # The files in mongoose/repo/images are local state (photos of products) and need to be preserved.
  # Link them to backup_data_dir so they are included in the backups
  - name: "link images directory to backup directory"
    ansible.builtin.file:
      src: "{{ backup_data_dir }}/mongoose"
      path: "{{ home }}/repo/images"
      state: "link"

  - name: "install dependencies via uv"
    ansible.builtin.command: "{{ uv.install_dir }}/uv sync"
    args:
      chdir: "{{ home }}/repo"
    notify:
      - "restart mongoose"
      - "run migrations"

  - name: "template environment file for mongoose"
    ansible.builtin.template:
      src: ".env.j2"
      dest: "{{ home }}/repo/.env"
    diff: false
    notify: "restart mongoose"

- name: "template systemd service file for mongoose"
  ansible.builtin.template:
    src: "mongoose.service.j2"
    dest: "/etc/systemd/system/mongoose.service"
  notify: "restart mongoose"

- name: "flush_handlers"
  ansible.builtin.meta: "flush_handlers"

- name: "ensure mongoose service is running"
  ansible.builtin.systemd:
    name: "mongoose.service"
    state: "started"
    enabled: true
