---
- name: "create user for listmonk"
  ansible.builtin.user:
    name: "listmonk"
    home: "/var/www/listmonk"
    shell: "/usr/sbin/nologin"
    state: "present"
    system: true
    groups: "docker"
    append: true

- name: "Do database setup"
  become_user: "postgres"
  become: true
  block:
  - name: "Ensure role exists"
    community.postgresql.postgresql_user:
      name: "listmonk"
      password: "{{ secret_listmonk.postgres_password }}"
      state: "present"

  - name: "Ensure database exists"
    community.postgresql.postgresql_db:
      name: "listmonk"
      owner: "listmonk"
      state: "present"

  - name: "Specify password authentication method over sockets for this container"
    notify: "restart postgres" # Apply changes
    become_user: "postgres"
    become: true
    community.postgresql.postgresql_pg_hba:
      dest: "{{ postgres.pg_hba_path }}"
      backup: "true"
      backup_file: "{{ postgres.pg_hba_path }}.old"
      contype: "local"
      databases: "listmonk"
      users: "listmonk"
      method: "md5" # TODO use scram-sha-256 which is way safer

- name: "copy nginx configuration"
  ansible.builtin.template:
    src: "listmonk.conf.j2"
    dest: "/etc/nginx/sites-available/listmonk.{{ canonical_hostname }}.conf"
  notify: "reload nginx"

- name: "enable nginx configuration"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/listmonk.{{ canonical_hostname }}.conf"
    path: "/etc/nginx/sites-enabled/listmonk.{{ canonical_hostname }}.conf"
    state: "link"
  notify: "reload nginx"

- name: "set up listmonk"
  become_user: "listmonk"
  become: true
  block:
  - name: "copy config.toml file"
    ansible.builtin.template:
      src: "config.toml.j2"
      dest: "/var/www/listmonk/config.toml"
  - name: "copy docker compose file"
    ansible.builtin.template:
      src: "docker-compose.yml.j2"
      dest: "/var/www/listmonk/docker-compose.yml"

  - name: "Docker compose"
    ansible.builtin.include_tasks: "../docker/tasks/compose-up.yml"
    vars:
      project_source: "/var/www/listmonk"
      remove_images: all
      compose_file: "docker-compose.yml"
