---

- name: "install node version"
  listen: "radio repo updated"
  become_user: "radio"
  become: true
  ansible.builtin.shell: |
    source {{ nvm.script }}
    nvm install $(cat {{ home }}/repo/.nvmrc)
  args:
    chdir: "{{ home }}/repo"
    executable: "/bin/bash"
  notify: "radio node version changed"

- name: "run npm rebuild if needed"
  listen: "radio node version changed"
  become_user: "radio"
  become: true
  ansible.builtin.shell: |
    source {{ nvm.script }}
    nvm use
    npm rebuild
  args:
    chdir: "{{ home }}/repo"
    executable: "/bin/bash"
