---
- name: "restart mongoose"
  ansible.builtin.service:
    name: "mongoose"
    state: "restarted"

- name: "run migrations"
  become_user: "mongoose"
  become: true
  ansible.builtin.command: "{{ uv.install_dir }}/uv run --env-file .env manage.py migrate"
  args:
    chdir: "{{ home }}/repo"
  listen: "run migrations"
  notify: "restart mongoose"
