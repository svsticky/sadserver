---
- name: "create user"
  ansible.builtin.user:
    name: "tavern"
    home: "{{ tavern_home_dir }}"
    shell: "/usr/sbin/nologin"
    state: "present"
    system: true
    groups: "docker"
    append: true

- name: "ensure home directory exists with correct permissions"
  ansible.builtin.file:
    path: "{{ tavern_home_dir }}"
    state: "directory"
    owner: "tavern"
    group: "tavern"
    mode: "2750"

- name: "copy .env file"
  become_user: "tavern"
  become: true
  ansible.builtin.template:
    src: ".env.j2"
    dest: "{{ tavern_home_dir }}/.env"
    mode: "0600"
  diff: false

- name: "copy docker compose configuration"
  become_user: "tavern"
  become: true
  ansible.builtin.template:
    src: "compose.yaml.j2"
    dest: "{{ tavern_home_dir }}/compose.yaml"
    mode: "0644"

- name: "copy deploy script"
  ansible.builtin.template:
    src: "deploy-tavern.sh.j2"
    dest: "/usr/local/bin/deploy-tavern.sh"
    group: "tavern"
    mode: "0750"

- name: "copy systemd deploy service"
  ansible.builtin.template:
    src: "deploy-tavern.service.j2"
    dest: "/etc/systemd/system/deploy-tavern.service"
    mode: "0750"

- name: "copy nginx configuration"
  ansible.builtin.template:
    src: "tavern.conf.j2"
    dest: "/etc/nginx/sites-available/{{ item }}.conf"
  loop:
    - "koala.{{ canonical_hostname }}"
    - "api.koala.{{ canonical_hostname }}"
    - "docs.koala.{{ canonical_hostname }}"
    - "wordlid.{{ canonical_hostname }}"
    - "signup.{{ canonical_hostname }}"
  notify: "reload nginx"

- name: "enable nginx configurations"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}.conf"
    path: "/etc/nginx/sites-enabled/{{ item }}.conf"
    state: link
  loop:
    - "koala.{{ canonical_hostname }}"
    - "api.koala.{{ canonical_hostname }}"
    - "docs.koala.{{ canonical_hostname }}"
    - "wordlid.{{ canonical_hostname }}"
    - "signup.{{ canonical_hostname }}"
  notify: "reload nginx"

- name: "copy outbox monitor script"
  ansible.builtin.template:
    src: "check-tavern-outbox.sh.j2"
    dest: "/usr/local/bin/check-tavern-outbox.sh"
    group: "tavern"
    mode: "0750"

- name: "copy postgres password file for outbox monitor"
  become_user: "tavern"
  become: true
  ansible.builtin.template:
    src: "pgpass.j2"
    dest: "{{ tavern_home_dir }}/.pgpass"
    mode: "0600"
  diff: false

- name: "copy outbox monitor service and timer"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
  loop:
    - "check-tavern-outbox.service"
    - "check-tavern-outbox.timer"
  notify: "systemctl daemon-reload"

# The units may have only just been created, so reload systemd here instead of
# waiting for the handler. Skipped in check mode, where the units don't exist.
- name: "start and enable outbox monitor timer"
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: "check-tavern-outbox.timer"
    enabled: true
    state: "started"
    daemon_reload: true
