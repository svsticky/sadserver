---

- name: "copy systemd service for deploying branding"
  ansible.builtin.template:
    src: "deploy-branding.service.j2"
    dest: "/etc/systemd/system/deploy-branding.service"

- name: "copy deploy script"
  ansible.builtin.template:
    src: "deploy-branding.sh.j2"
    dest: "/usr/local/bin/deploy-branding.sh"
    mode: "0755"

- name: "run deploy"
  ansible.builtin.systemd:
    name: "deploy-branding.service"
    state: "started"
  ignore_errors: true
  notify:
    - "systemctl daemon-reload"

